[package]
name = "pump-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "=0.32.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true

